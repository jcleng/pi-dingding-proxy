services:
  pi-dingding-proxy:
    image: registry.cn-hangzhou.aliyuncs.com/jcleng/pi-dingding-proxy-latest
    container_name: pi-dingding-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      DD_APP_SECRET: ${DD_APP_SECRET:-}
      DD_VERIFY_SIGNATURE: ${DD_VERIFY_SIGNATURE:-1}
      PI_BIN: ${PI_BIN:-pi}
      PI_PROJECTS_FILE: ${PI_PROJECTS_FILE:-/root/.pi-web/projects.json}
      PI_SESSION_DIR: ${PI_SESSION_DIR:-/root/.pi/agent/sessions}
      PI_STATE_FILE: ${PI_STATE_FILE:-/root/.pi-dingding-proxy/state.json}
      PI_TIMEOUT: ${PI_TIMEOUT:-600}
    volumes:
      # 共享 opencode_root 卷：提供 /root 下的 pi 配置、models、sessions 与项目数据
      - opencode_root:/root/
      # 让 projects.json 里的项目路径可见；并覆盖 pi 的模型/工具配置（与 opencode 容器一致）
      - /home/jcleng/work/mywork/:/home/jcleng/work/mywork/
      - /home/jcleng/work/mywork/pi_models.json:/root/.pi/agent/models.json:ro
      - /home/jcleng/work/mywork/pi_mcp.json:/root/.pi/agent/mcp.json:ro

volumes:
  # 与 pi agent 使用同一个 opencode_root 卷（mywork/docker-compose.yml 中声明）
  opencode_root:
    external: true
    name: mywork_opencode_root